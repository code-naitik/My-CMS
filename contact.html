<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Naitik</title>

    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="theme.css">

</head>


<body>

    <header>

        <h2>Naitik</h2>

        <nav>

            <a href="home.html">Home</a>
            <a href="home.html#videos">Videos</a>
            <a href="blogs.html">Blogs</a>
            <a href="home.html#about">About</a>
            <a href="home.html#social">Social Media</a>
            <a href="contact.html">Contact Us</a>

        </nav>

    </header>


    <main>

        <h1>Contact Us</h1>

        <p>
            Have a question or want to get in touch?
            Send me a message.
        </p>


        <form id="contact-form">

            <label>Name</label>

            <input
                type="text"
                id="name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>Subject</label>

            <input
                type="text"
                id="subject"
                required
            >


            <label>Message</label>

            <textarea
                id="message"
                rows="6"
                required
            ></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>

    </main>


    <script src="contact.js"></script>

</body>

</html>
