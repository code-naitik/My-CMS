<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog | Dashboard</title>
    <link rel="stylesheet" href="add-page.css">
    <link rel="stylesheet" href="theme.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header>
        <h2>Add New Blog</h2>
        <a href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main>
        <div class="form-box">
            <h1>Write a Blog Post</h1>
            <form id="blog-form">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter the blog title" required>

                <label for="editor-label">Content</label>

                <div id="toolbar" class="ql-toolbar ql-snow">
                    <button class="ql-bold" type="button"></button>
                    <button class="ql-italic" type="button"></button>

                    <span class="underline-wrapper">
                        <button type="button" id="underline-btn" class="underline-custom-btn" title="Underline color">
                            <span class="u-letter">U</span>
                            <span class="u-caret">▾</span>
                        </button>

                        <div id="underline-color-popup" class="color-popup">
                            <button type="button" class="color-swatch" data-color="" style="background:#888;" title="No color (default)"></button>
                            <button type="button" class="color-swatch" data-color="#e7edf5" style="background:#e7edf5;" title="White"></button>
                            <button type="button" class="color-swatch" data-color="#e76f51" style="background:#e76f51;" title="Coral"></button>
                            <button type="button" class="color-swatch" data-color="#f1b94b" style="background:#f1b94b;" title="Gold"></button>
                            <button type="button" class="color-swatch" data-color="#9ed8c8" style="background:#9ed8c8;" title="Mint"></button>
                            <button type="button" class="color-swatch" data-color="#818cf8" style="background:#818cf8;" title="Violet"></button>
                            <button type="button" class="color-swatch" data-color="#d55d6b" style="background:#d55d6b;" title="Red"></button>
                            <button type="button" class="color-swatch remove-swatch" data-color="none" title="Remove underline">✕</button>
                        </div>
                    </span>

                    <select class="ql-color"></select>
                    <button class="ql-link" type="button"></button>
                    <button class="ql-image" type="button"></button>
                </div>

                <div id="editor"></div>

                <button type="submit">Publish Blog</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script src="add-blog.js"></script>
</body>
</html>
