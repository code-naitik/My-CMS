<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog | Dashboard</title>
    <link rel="stylesheet" href="add-page.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <header>
        <h2>Add New Blog</h2>
        <a href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main>
        <div class="form-box">
            <h1>Write a Blog Post</h1>
            <form id="blog-form">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter the blog title" required>

                <label for="content">Content</label>
                <textarea id="content" placeholder="Write your blog post here..." required></textarea>

                <button type="submit">Publish Blog</button>
            </form>
        </div>
    </main>

    <script src="add-blog.js"></script>
</body>
</html>
